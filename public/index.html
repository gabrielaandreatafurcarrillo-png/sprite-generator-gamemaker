<!DOCTYPE html>\n<html lang=\"es\">\n  <head>\n    <meta charset=\"UTF-8\" />\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n    <title>Sprite Generator for GameMaker</title>\n    <link rel=\"stylesheet\" href=\"/styles.css\" />\n  </head>\n  <body>\n    <main class=\"app-shell\">\n      <section class=\"panel\">\n        <h1>Sprite Generator</h1>\n        <p class=\"subtitle\">Genera hojas de sprite pixel-art retro 8-bit para GameMaker</p>\n\n        <form id=\"spriteForm\" enctype=\"multipart/form-data\">\n          <label class=\"field\">\n            <span>Personaje</span>\n            <input id=\"spriteImage\" type=\"file\" accept=\"image/png, image/jpeg, image/webp\" required />\n          </label>\n\n          <div class=\"row\">\n            <label class=\"field small\">\n              <span>Animación</span>\n              <select id=\"animation\">\n                <option value=\"walk\">Caminar</option>\n                <option value=\"idle\">Idle</option>\n                <option value=\"run\">Correr</option>\n                <option value=\"jump\">Saltar</option>\n                <option value=\"attack\">Atacar</option>\n                <option value=\"hurt\">Herido</option>\n              </select>\n            </label>\n\n            <label class=\"field small\">\n              <span>Dirección</span>\n              <select id=\"direction\">\n                <option value=\"right\">Derecha</option>\n                <option value=\"left\">Izquierda</option>\n                <option value=\"front\">Frontal</option>\n                <option value=\"back\">Trasera</option>\n              </select>\n            </label>\n          </div>\n\n          <label class=\"field\">\n            <span>Tamaño por frame</span>\n            <input id=\"frameSize\" type=\"number\" min=\"16\" max=\"128\" step=\"8\" value=\"64\" />\n          </label>\n\n          <button type=\"submit\">Generar hoja de sprite</button>\n        </form>\n\n        <p id=\"statusText\" class=\"status\">Listo para generar.</p>\n        <p id=\"loadingMessage\" class=\"loading\" hidden>Procesando frames...</p>\n      </section>\n\n      <section id=\"resultContainer\" class=\"result-panel\" hidden>\n        <h2>Vista previa</h2>\n        <div class=\"sheet-frame\">\n          <img id=\"spritePreview\" alt=\"Sprite sheet preview\" />\n        </div>\n        <div id=\"spriteMeta\" class=\"meta-box\"></div>\n      </section>\n    </main>\n\n    <script src=\"/app.js\"></script>\n  </body>\n</html>\n
