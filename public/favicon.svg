* {
  box-sizing: border-box;
}

:root {
  --bg: #0d1117;
  --panel: #161b22;
  --panel-alt: #1f2a37;
  --primary: #8be9fd;
  --accent: #50fa7b;
  --warning: #ffb86c;
  --text: #f5f5f5;
  --muted: #c0c7d1;
  --danger: #ff6b6b;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;
  background: linear-gradient(160deg, #0d1117, #111827);
  color: var(--text);
}

.app-shell {
  max-width: 1100px;
  margin: 0 auto;
  padding: 32px 20px;
  display: grid;
  grid-template-columns: 420px 1fr;
  gap: 24px;
}

.panel,
.result-panel {
  background: rgba(22, 27, 34, 0.96);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px;
  padding: 24px;
  box-shadow: 0 12px 25px rgba(0,0,0,0.24);
}

h1,
h2 {
  margin-top: 0;
}

.subtitle {
  color: var(--muted);
  margin-bottom: 20px;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 16px;
}

.field span {
  font-weight: 600;
}

input,
select,
button {
  width: 100%;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.12);
  background: #0d1117;
  color: var(--text);
  padding: 12px 14px;
  font-size: 1rem;
}

button {
  margin-top: 10px;
  background: linear-gradient(135deg, #50fa7b, #8be9fd);
  color: #111827;
  font-weight: 700;
  cursor: pointer;
  border: none;
}

button:hover {
  filter: brightness(1.05);
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.status {
  margin-top: 18px;
  color: var(--accent);
  font-weight: 600;
}

.loading {
  color: var(--warning);
  font-weight: 600;
}

.sheet-frame {
  background: repeating-linear-gradient(
    45deg,
    rgba(255,255,255,0.04),
    rgba(255,255,255,0.04) 10px,
    rgba(0,0,0,0.06) 10px,
    rgba(0,0,0,0.06) 20px
  );
  border-radius: 12px;
  padding: 18px;
  display: grid;
  place-items: center;
  min-height: 320px;
}

.sheet-frame img {
  max-width: 100%;
  image-rendering: pixelated;
  border: 1px solid rgba(255,255,255,0.12);
  background: transparent;
}

.meta-box {
  margin-top: 18px;
  background: rgba(255,255,255,0.02);
  border-radius: 12px;
  padding: 14px;
  line-height: 1.7;
  color: var(--muted);
}

.meta-box a {
  color: var(--primary);
}

@media (max-width: 800px) {
  .app-shell {
    grid-template-columns: 1fr;
  }
}
